<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f78c4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Peg or Not">
<title>Peg or Not</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600&display=swap">
<style>
/* Layout: full-bleed sky that reflects the day's conditions; one centred column of glass panels.
   Answer first (score, verdict, times), then a scrubbable day, then detail behind taps. */
:root{
  /* sky gradients per condition — light */
  --sun-a:#2c6fb8; --sun-b:#6aa4da; --sun-c:#9cc3e6;
  --cloud-a:#56707f; --cloud-b:#7d95a3; --cloud-c:#a3b4be;
  --rain-a:#34495a; --rain-b:#4f6578; --rain-c:#6f8597;
  --glass:rgba(12,32,52,.16); --glass-hi:rgba(255,255,255,.16); --edge:rgba(255,255,255,.24);
  --fg:#ffffff; --fg-2:rgba(255,255,255,.78); --fg-3:rgba(255,255,255,.56);
  --warm:#ffd27a; --rainc:#bfe1ff;
  --great:#7ff0b4; --good:#c6f08a; --mixed:#ffd27a; --poor:#ffab7a; --bad:#ff8f8f;
  --sheet:rgba(14,30,46,.55);
  --f-ui:"Geist",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Geist",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.16,1,.3,1);
  --r:22px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sun-a:#081b30; --sun-b:#123a63; --sun-c:#1e5689;
  --cloud-a:#10171d; --cloud-b:#1d2a33; --cloud-c:#2b3b47;
  --rain-a:#080e13; --rain-b:#132029; --rain-c:#1f303c;
  --glass:rgba(255,255,255,.06); --glass-hi:rgba(255,255,255,.1); --edge:rgba(255,255,255,.12);
  --sheet:rgba(6,12,18,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --sun-a:#081b30; --sun-b:#123a63; --sun-c:#1e5689;
  --cloud-a:#10171d; --cloud-b:#1d2a33; --cloud-c:#2b3b47;
  --rain-a:#080e13; --rain-b:#132029; --rain-c:#1f303c;
  --glass:rgba(255,255,255,.06); --glass-hi:rgba(255,255,255,.1); --edge:rgba(255,255,255,.12);
  --sheet:rgba(6,12,18,.7);
  color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  --g1:var(--sun-a); --g2:var(--sun-b); --g3:var(--sun-c);
  background:var(--g1); min-height:100vh;
  color:var(--fg); font:400 16px/1.45 var(--f-ui); letter-spacing:-.005em;
  padding-inline:16px; padding-block:max(18px,env(safe-area-inset-top,0px)) 56px;
  transition:background-color .8s;
}
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none}
.sky i{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.sky i[data-k="sun"]{background:linear-gradient(180deg,var(--sun-a) 0%,var(--sun-b) 55%,var(--sun-c) 100%)}
.sky i[data-k="cloud"]{background:linear-gradient(180deg,var(--cloud-a) 0%,var(--cloud-b) 55%,var(--cloud-c) 100%)}
.sky i[data-k="rain"]{background:linear-gradient(180deg,var(--rain-a) 0%,var(--rain-b) 55%,var(--rain-c) 100%)}
body[data-sky="sun"] .sky i[data-k="sun"],body[data-sky="cloud"] .sky i[data-k="cloud"],body[data-sky="rain"] .sky i[data-k="rain"]{opacity:1}
.sky b{position:absolute;width:70vmax;height:70vmax;border-radius:50%;left:50%;top:-30vmax;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(255,255,255,.22),rgba(255,255,255,0));transition:opacity 1.1s}
body[data-sky="rain"] .sky b{opacity:.25}
body[data-sky="cloud"]{--g1:var(--cloud-a);--g2:var(--cloud-b);--g3:var(--cloud-c)}
body[data-sky="rain"]{--g1:var(--rain-a);--g2:var(--rain-b);--g3:var(--rain-c)}
.wrap{max-width:480px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
main{min-width:0}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.place{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--fg);font:500 1.05rem var(--f-ui);padding:6px 0;cursor:pointer;min-width:0}
.place span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.place svg{flex:none;opacity:.8}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--edge);color:var(--fg);cursor:pointer;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}

/* hero */
.hero{text-align:center;padding-block:18px 14px}
.eyebrow{font:500 .82rem var(--f-ui);color:var(--fg-2);letter-spacing:.02em}
.score{font:200 8rem/0.9 var(--f-num);letter-spacing:-.065em;font-feature-settings:"tnum" 1,"ss01" 1;margin:10px 0 4px;padding-right:.06em}
.verdict{font:500 1.5rem/1.2 var(--f-ui);letter-spacing:-.02em;display:inline-flex;align-items:center;gap:10px}
.verdict i{width:9px;height:9px;border-radius:50%;background:var(--great);box-shadow:0 0 0 4px rgba(255,255,255,.12)}
.summary{color:var(--fg-2);margin:10px auto 0;max-width:34ch;text-wrap:balance}

/* glass */
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%)}
.times{display:grid;grid-template-columns:repeat(3,1fr)}
.times div{padding:14px 10px;text-align:center;min-width:0}
.times div+div{border-left:1px solid var(--edge)}
.times small{display:block;font:500 .7rem var(--f-ui);text-transform:uppercase;letter-spacing:.1em;color:var(--fg-3);margin-bottom:4px}
.times b{display:block;font:300 1.45rem var(--f-num);font-feature-settings:"tnum" 1;letter-spacing:-.03em}

/* scrubber */
.panel{padding:16px}
.label{font:500 .72rem var(--f-ui);text-transform:uppercase;letter-spacing:.1em;color:var(--fg-3);display:flex;align-items:center;gap:8px}
.read{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:8px 0 6px;flex-wrap:wrap}
.read .h{font:300 1.9rem var(--f-num);font-feature-settings:"tnum" 1;letter-spacing:-.04em}
.read .h small{font:500 .85rem var(--f-ui);color:var(--fg-2);letter-spacing:0;margin-left:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font:500 .8rem var(--f-num);font-feature-settings:"tnum" 1;transition:background .2s;padding:5px 9px;border-radius:999px;background:var(--glass-hi);color:var(--fg);white-space:nowrap}
.chip em{font-style:normal;color:var(--fg-3);margin-right:4px;font-family:var(--f-ui)}
.scrub{position:relative;touch-action:none;cursor:ew-resize;outline:none;border-radius:12px}
.scrub:focus-visible{box-shadow:0 0 0 2px var(--fg)}
.scrub svg{display:block;width:100%;height:auto}
.scrub text{font:500 10px var(--f-num);fill:var(--fg-3);font-feature-settings:"tnum" 1}
.hint{font-size:.78rem;color:var(--fg-3);text-align:center;margin-top:6px}

/* disclosure */
details{overflow:hidden}
summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px;cursor:pointer;font:500 1rem var(--f-ui)}
summary::-webkit-details-marker{display:none}
summary .meta{color:var(--fg-3);font-size:.84rem;display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap}
summary .meta>span{overflow:hidden;text-overflow:ellipsis}
summary .chev{transition:transform .25s}
summary:focus-visible{outline:2px solid var(--fg);outline-offset:-4px;border-radius:var(--r)}
.dbody{padding:0 16px 16px;display:grid;gap:14px}
.f{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.f .n{font-weight:500}
.f .v{font:400 .88rem var(--f-num);font-feature-settings:"tnum" 1;color:var(--fg-2);text-align:right}
.f .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--glass-hi);overflow:hidden}
.f .bar i{display:block;height:100%;border-radius:2px;background:var(--fg)}
.f .note{grid-column:1/-1;font-size:.84rem;color:var(--fg-3)}
.days{display:grid;gap:2px;padding:0 8px 8px}
.dayrow{display:grid;grid-template-columns:4.2rem 2.4rem 1fr auto;gap:10px;align-items:center;padding:12px 8px;border-radius:14px;background:none;border:0;color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.dayrow:hover{background:var(--glass-hi)}
.dayrow[aria-current="true"]{background:var(--glass-hi)}
.dayrow .dn{font-weight:500}
.dayrow .ds{font:300 1.15rem var(--f-num);font-feature-settings:"tnum" 1;text-align:right;letter-spacing:-.02em}
.dayrow .dbar{height:4px;border-radius:2px;background:var(--glass-hi);overflow:hidden}
.dayrow .dbar i{display:block;height:100%;border-radius:2px}
.dayrow .dv{font-size:.82rem;color:var(--fg-3);min-width:5.5rem;text-align:right}

.foot{font-size:.76rem;color:var(--fg-3);text-align:center;margin-top:6px}
.foot a{color:var(--fg-2)}
.foot button{background:none;border:0;color:var(--fg-2);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.status{text-align:center;color:var(--fg-2);padding:40px 0}

/* setup sheet */
.sheet{position:fixed;inset:0;z-index:20;display:grid;place-items:end center;background:var(--sheet);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:16px}
.sheet[hidden]{display:none}
.card{width:100%;max-width:440px;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));border-radius:28px;background:linear-gradient(180deg,var(--g2),var(--g1));border:1px solid var(--edge);box-shadow:0 30px 80px rgba(0,0,0,.35)}
@media (min-width:600px){.sheet{place-items:center}}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps i{height:3px;flex:1;border-radius:2px;background:var(--glass-hi)}
.q{font:400 1.6rem/1.2 var(--f-ui);letter-spacing:-.03em;margin:0 0 6px;text-wrap:balance}
.qs{color:var(--fg-2);margin:0 0 18px;font-size:.92rem}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;text-align:left;padding:14px 16px;border-radius:16px;background:var(--glass);border:1px solid var(--edge);color:var(--fg);font:inherit;cursor:pointer;transition:background .15s,transform .15s}
.opt:hover{background:var(--glass-hi)}
.opt:active{transform:scale(.985)}
.opt[aria-pressed="true"]{background:var(--fg);color:var(--g1)}
.opt b{font-weight:500}
.opt span{grid-column:1;font-size:.84rem;opacity:.75}
.grid4{grid-template-columns:repeat(4,1fr)}
.grid4 .opt{grid-template-columns:1fr;text-align:center;padding:14px 4px;font:400 1.05rem var(--f-num);font-feature-settings:"tnum" 1}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.ghost{background:none;border:0;color:var(--fg-2);font:500 .95rem var(--f-ui);cursor:pointer;padding:8px 0}
.primary{background:var(--fg);color:var(--g1);border:0;border-radius:999px;padding:12px 22px;font:600 .95rem var(--f-ui);cursor:pointer}
.primary:disabled{opacity:.4;cursor:default}
.search{width:100%;font:400 1rem var(--f-ui);padding:14px 16px;border-radius:16px;border:1px solid var(--edge);background:var(--glass);color:var(--fg);outline:none}
.search::placeholder{color:var(--fg-3)}
.search:focus{border-color:var(--fg-2)}
.res{display:grid;gap:6px;margin-top:8px}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
button{transition:transform .22s var(--spring),background-color .2s,opacity .2s;touch-action:manipulation}
button:active{transform:scale(.96)}
.iconbtn:active{transform:scale(.88)}
.iconbtn svg{transition:transform .5s var(--spring)}
.iconbtn:hover svg{transform:rotate(90deg)}
.dayrow:active{transform:scale(.985)}
.primary:hover{transform:translateY(-1px)}
.primary:active{transform:scale(.95)}
.place:active{transform:scale(.97)}
.opt[aria-pressed="true"]{animation:pick .35s var(--spring)}
@keyframes pick{40%{transform:scale(1.025)}}
details{transition:background-color .2s}
summary .chev{transition:transform .4s var(--spring)}
details.is-open summary .chev{transform:rotate(180deg)}
#cursor{transition:transform .22s var(--ease)}
#cd{transition:transform .22s var(--ease)}
.loader{display:inline-flex;gap:6px;margin-top:14px}
.loader i{width:7px;height:7px;border-radius:50%;background:var(--fg-2);animation:dot 1.1s ease-in-out infinite}
.loader i:nth-child(2){animation-delay:.15s}.loader i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.steps i{position:relative;overflow:hidden;background:var(--glass-hi)}
.steps i::after{content:"";position:absolute;inset:0;background:var(--fg);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--spring)}
.steps i.on::after{transform:scaleX(1)}
.sheet{transition:opacity .3s ease}
.sheet.closing{opacity:0}

@media (max-width:380px){.score{font-size:6rem}.times b{font-size:1.05rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

.tools{display:flex;align-items:center;gap:8px}
.clock{font:400 .95rem var(--f-num);font-feature-settings:"tnum" 1;color:var(--fg-2);padding-right:4px}
#refreshBtn:hover svg{transform:none}
.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin-inline:-2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dp{flex:none;display:grid;gap:4px;justify-items:center;min-width:56px;padding:9px 10px;border-radius:16px;background:var(--glass);border:1px solid var(--edge);color:var(--fg);font:500 .82rem var(--f-ui);cursor:pointer}
.dp b{font:400 1rem var(--f-num);font-feature-settings:"tnum" 1}
.dp i{width:6px;height:6px;border-radius:50%}
.dp[aria-selected="true"]{background:var(--fg);color:var(--g1)}
.ctl{padding:4px 16px}
.crow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;min-height:54px}
.crow+.crow{border-top:1px solid var(--edge)}
.cl{font:500 .82rem var(--f-ui);color:var(--fg-2)}
.seg{display:inline-flex;background:var(--glass-hi);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--fg-2);font:500 .85rem var(--f-ui);padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--g1)}
.pill{border:1px solid var(--edge);background:var(--glass-hi);color:var(--fg);font:500 .85rem var(--f-ui);padding:7px 14px;border-radius:999px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--fg);color:var(--g1);border-color:transparent}
.pill:disabled{opacity:.35;pointer-events:none}
.startc{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.stepper{display:inline-flex;align-items:center;background:var(--glass-hi);border-radius:999px}
.stepper button{width:36px;height:36px;border:0;background:none;color:var(--fg);font:300 1.3rem var(--f-ui);cursor:pointer;border-radius:50%}
.stepper span{min-width:3.4rem;text-align:center;font:400 1rem var(--f-num);font-feature-settings:"tnum" 1}
.linkbtn{background:none;border:0;color:var(--fg-2);font:500 .85rem var(--f-ui);text-decoration:underline;text-underline-offset:3px;cursor:pointer;margin-top:8px;padding:4px}
.times em{display:block;font:400 .74rem var(--f-ui);font-style:normal;color:var(--fg-3);margin-top:2px;min-height:1.1em}
.shead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.read{align-items:center}
.cl{white-space:nowrap}
.startc{flex-wrap:nowrap}
.startc .pill{padding:7px 12px}
.startc .stepper span{min-width:3rem}
.startc .stepper button{width:32px}
@media (max-width:380px){.startc{flex-wrap:wrap}}
</style>
</head>
<body data-sky="sun">
<div class="sky" aria-hidden="true"><i data-k="sun"></i><i data-k="cloud"></i><i data-k="rain"></i><b></b></div>
<div class="wrap">
  <div class="top">
    <button class="place" id="placeBtn" type="button" aria-label="Change location">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>
      <span id="placeName">Orpington</span>
    </button>
    <div class="tools"><span class="clock" id="clock">--:--</span>
    <button class="iconbtn" id="refreshBtn" type="button" aria-label="Refresh forecast"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    <button class="iconbtn" id="setupBtn" type="button" aria-label="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button></div>
  </div>

  <div id="status" class="status"><span id="statusText">Checking the sky</span><br><span class="loader" id="loader"><i></i><i></i><i></i></span></div>

  <main id="main" hidden>
    <div class="strip" id="strip" role="tablist" aria-label="Choose a day"></div>
    <section class="hero">
      <div class="eyebrow" id="eyebrow">Today</div>
      <div class="score" id="score">–</div>
      <div class="verdict"><i id="dot"></i><span id="verdict"></span></div>
      <p class="summary" id="summary"></p>
      <button class="linkbtn" id="compare" type="button" hidden></button>
    </section>

    <div class="wrap">
      <section class="glass times">
        <div><small>Hang out</small><b id="tOut">–</b><em id="rOut"></em></div>
        <div><small>Dry by</small><b id="tDry">–</b><em id="rDry"></em></div>
        <div><small>Bring in</small><b id="tIn">–</b><em id="rIn"></em></div>
      </section>

      <section class="glass ctl">
        <div class="crow"><span class="cl">Washing</span>
          <div class="seg" id="segLoad" role="group" aria-label="Washing type"><button type="button" data-v="light">Light</button><button type="button" data-v="mixed">Mixed</button><button type="button" data-v="heavy">Heavy</button></div></div>
        <div class="crow"><span class="cl">Hang out</span>
          <div class="startc"><button class="pill" id="stBest" type="button">Best</button><button class="pill" id="stNow" type="button">Now</button>
            <div class="stepper"><button id="stMinus" type="button" aria-label="30 minutes earlier">−</button><span id="stVal">–</span><button id="stPlus" type="button" aria-label="30 minutes later">+</button></div></div></div>
        <div class="crow"><span class="cl">You're</span>
          <div class="seg" id="segHome" role="group" aria-label="Home or out"><button type="button" data-v="home">Home</button><button type="button" data-v="out">Out</button></div></div>
        <div class="crow" id="backRow" hidden><span class="cl">Back by</span>
          <div class="stepper"><button id="bkMinus" type="button" aria-label="Earlier">−</button><span id="bkVal">17:00</span><button id="bkPlus" type="button" aria-label="Later">+</button></div></div>
      </section>

      <section class="glass panel">
        <div class="label">Drag through the day</div>
        <div class="read"><div class="h" id="rHour">12:00<small id="rScore"></small></div><button class="pill" id="setHere" type="button">Hang out here</button></div>
        <div class="chips" id="rChips"></div>
        <div class="scrub" id="scrub" tabindex="0" role="slider" aria-label="Hour of day" aria-valuemin="0" aria-valuemax="23" aria-valuenow="12">
          <svg id="chart" viewBox="0 0 400 150" preserveAspectRatio="none"></svg>
        </div>
        <div class="hint">Bright band: best window · bars: rain chance</div>
      </section>

      <details class="glass" id="whyBox">
        <summary>Why this score <span class="meta"><span id="whyMeta"></span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></span></summary>
        <div class="dbody" id="factors"></div>
      </details>

      <details class="glass" id="weekBox">
        <summary>Next 7 days <span class="meta"><span id="weekMeta"></span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></span></summary>
        <div class="days" id="days"></div>
      </details>

      <p class="foot">Forecast by <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> · <span id="updated"></span></p>
    </div>
  </main>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Settings">
  <div class="card">
    <div class="shead"><h2 class="q" style="margin:0">Settings</h2><button class="primary" id="done" type="button">Done</button></div>
    <p class="qs" style="margin-top:14px">Where's your washing line?</p>
    <input class="search" id="search" type="search" placeholder="Search a town or city" autocomplete="off" aria-label="Search town">
    <div class="res" id="res"></div>
    <p class="qs" style="margin:18px 0 8px">Tumble dryer at home?</p>
    <div class="seg" id="segDryer" role="group" aria-label="Tumble dryer"><button type="button" data-v="yes">Yes</button><button type="button" data-v="no">No</button></div>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const pad = n => String(n).padStart(2, "0");
const fmtH = h => { let hh = Math.floor(h), mm = Math.round((h - hh) * 12) * 5; if (mm === 60){ hh++; mm = 0; } return pad(hh) + ":" + pad(mm); };
const hourOf = s => +s.slice(11,13) + +s.slice(14,16) / 60;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const anim = (el, kf, opt) => (reduce || !el || !el.animate) ? null : el.animate(kf, Object.assign({ fill: "both" }, opt));
const SPRING = "cubic-bezier(.16,1,.3,1)", EASE = "cubic-bezier(.2,.8,.2,1)";
let shownScore = null, firstRender = true;
function countTo(el, to){
  if (typeof to !== "number" || reduce){ el.textContent = to; shownScore = typeof to === "number" ? to : null; return; }
  const from = shownScore ?? 0, t0 = performance.now(), dur = 900;
  shownScore = to;
  const tick = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 4);
    el.textContent = Math.round(from + (to - from) * e);
    if (k < 1 && shownScore === to) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

let place = store.get("pon.place", { name: "Orpington", lat: 51.3742, lon: 0.0985 });
let setup = Object.assign({ load: "mixed", home: true, back: 17, dryer: false }, store.get("pon.setup", {}));
let startAt = null, baseNow = 12, fetchedAt = Date.now(), stale = false, soft = false;
const liveNow = () => baseNow + (Date.now() - fetchedAt) / 3.6e6;
let data = null, days = [], selected = 0, nowH = 12, scrubH = 12;

const NEED = { light: 0.75, mixed: 1, heavy: 1.4 };
const LOADNAME = { light: "Light load", mixed: "Mixed load", heavy: "Towels & jeans" };
const TIERS = [[80,"Peg it out","var(--great)"],[62,"Good drying day","var(--good)"],[45,"Bit of a gamble","var(--mixed)"],[25,"Poor drying","var(--poor)"],[0,"Keep it inside","var(--bad)"]];
const tier = s => TIERS.find(t => s >= t[0]);

/* ---------- drying model ---------- */
const vpdOf = (t, rh) => 0.6108 * Math.exp(17.27 * t / (t + 237.3)) * (1 - rh / 100);
function rateHour(h){
  const vpd = h.vpd ?? vpdOf(h.t, h.rh);
  const sV = clamp(vpd / 1.0, 0, 1);
  let sW = h.wind < 3 ? 0.1 : clamp(h.wind / 20, 0, 1);
  if (h.gust > 60) sW *= 0.6;
  const sS = clamp(h.rad / 450, 0, 1), sT = clamp((h.t - 3) / 17, 0, 1);
  const base = 0.35 * sV + 0.25 * sW + 0.25 * sS + 0.15 * sT;
  const wet = h.precip >= 0.3;
  const rf = wet ? 0 : 1 - Math.pow(h.p / 100, 1.2) * 0.9;
  return { base, vpd, wet, score: Math.round(100 * base * rf) };
}

function evalStart(day, startT, until){
  const need = NEED[setup.load || "mixed"], home = setup.home !== false;
  const { sunrise, sunset, hours } = day;
  const backAt = home ? sunset : Math.min(setup.back ?? 17, sunset);
  let prog = 0, maxP = 0, end = startT, done = false, interrupted = false, doneAt = null, soaked = false;
  for (const h of hours){
    if (h.hour + 1 <= startT) continue;
    if (h.hour >= backAt || h.hour >= sunset) break;
    if (until != null && h.hour >= until) break;
    const a = Math.max(h.hour, startT, sunrise), z = Math.min(h.hour + 1, sunset, backAt, until ?? 99), f = z - a;
    if (f <= 0) continue;
    if (home && (h.r.wet || h.p >= 60)){ interrupted = true; end = h.hour; break; }
    if (!home && h.r.wet){ soaked = true; prog *= 0.3; continue; }
    maxP = Math.max(maxP, h.p);
    const rate = 0.48 * Math.pow(h.r.base, 1.5) * f;
    if (!done && prog + rate >= need){ doneAt = a + (need - prog) / rate * f; prog = need; done = true; end = a + f; if (home) break; }
    else if (!done){ prog += rate; end = z; }
  }
  const q = Math.min(1, prog / need);
  if (until != null) return { q, done };
  if (!home) hours.forEach(h => { if (h.hour + 1 > startT && h.hour < backAt){ maxP = Math.max(maxP, h.p); if (h.r.wet) soaked = true; } });
  const risk = 1 - (home ? 0.6 : 0.9) * Math.pow(maxP / 100, 1.3);
  const hrs = (doneAt ?? end) - startT;
  const speed = done ? clamp(1.09 - 0.03 * hrs, 0.75, 1) : 0.85;
  const score = Math.round(100 * Math.pow(q, 1.5) * risk * speed * (soaked ? 0.3 : 1));
  let bringIn = backAt;
  if (home){ const rainy = hours.find(h => h.hour >= Math.floor(doneAt ?? startT) && (h.r.wet || h.p >= 50)); bringIn = Math.max(Math.min(rainy ? rainy.hour : sunset, sunset), doneAt ?? startT); }
  return { score, start: startT, end, doneAt, done, interrupted, soaked, q, maxP, bringIn };
}

function analyseDay(day, startFrom){
  const home = setup.home !== false, times = [];
  if (startFrom % 1 > 0.01) times.push(startFrom);
  for (let t = Math.ceil(startFrom - 0.01); t < day.sunset - 0.5; t++) times.push(t);
  let best = null;
  for (const t of times){
    const hr = day.hours.find(h => h.hour === Math.floor(t));
    if (!hr || hr.r.wet || (home && hr.p >= 60)) continue;
    const r = evalStart(day, t);
    if (!best || r.score > best.score) best = r;
  }
  return best || { score: 0, none: true };
}

/* ---------- data ---------- */
let loading = false;
async function fetchForecast(silent){
  if (loading) return; loading = true;
  if (!silent || !data){ $("status").hidden = false; $("main").hidden = true; $("statusText").textContent = "Checking the sky"; $("loader").hidden = false; firstRender = true; }
  $("refreshBtn").firstElementChild.classList.add("spin");
  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + place.lat + "&longitude=" + place.lon +
    "&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,precipitation,wind_speed_10m,wind_gusts_10m,shortwave_radiation,cloud_cover,vapour_pressure_deficit" +
    "&daily=sunrise,sunset&current=temperature_2m&timezone=auto&forecast_days=7&wind_speed_unit=kmh";
  let fresh = null, fromNet = false;
  try { const r = await fetch(url); if (!r.ok) throw 0; fresh = await r.json(); fromNet = true; }
  catch {
    const c = store.get("pon.cache", null);
    if (!data && c && c.lat === place.lat && c.lon === place.lon && Date.now() - c.at < 3 * 3.6e6){ fresh = c.data; fetchedAt = c.at; }
  }
  loading = false; $("refreshBtn").firstElementChild.classList.remove("spin");
  if (!fresh){
    if (data){ stale = true; updateStamp(); return; }
    $("statusText").textContent = "Couldn't reach the forecast. Check your connection, then tap refresh."; $("loader").hidden = true; return;
  }
  if (fromNet){ fetchedAt = Date.now(); stale = false; store.set("pon.cache", { lat: place.lat, lon: place.lon, at: fetchedAt, data: fresh }); } else stale = true;
  data = fresh; baseNow = hourOf(data.current.time);
  soft = !!silent && !firstRender; build(); render(soft); soft = false; updateStamp();
}
function updateStamp(){
  const t = new Date(fetchedAt).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  $("updated").textContent = (stale ? "Offline, forecast from " : "Updated ") + t;
}

function build(){
  const H = data.hourly, D = data.daily, now = data.current.time, nowDate = now.slice(0,10);
  nowH = liveNow();
  days = D.time.map((date, i) => {
    const hours = [];
    H.time.forEach((t, j) => {
      if (t.slice(0,10) !== date) return;
      const h = { hour: +t.slice(11,13), t: H.temperature_2m[j], rh: H.relative_humidity_2m[j], p: H.precipitation_probability[j] ?? 0,
        precip: H.precipitation[j] ?? 0, wind: H.wind_speed_10m[j], gust: H.wind_gusts_10m[j], rad: H.shortwave_radiation[j], cloud: H.cloud_cover[j], vpd: H.vapour_pressure_deficit[j] };
      h.r = rateHour(h); hours.push(h);
    });
    const day = { date, sunrise: hourOf(D.sunrise[i]), sunset: hourOf(D.sunset[i]), hours, isToday: date === nowDate };
    const startFrom = day.isToday ? nowH : Math.ceil(day.sunrise);
    day.over = day.isToday && nowH > day.sunset - 1;
    day.best = day.over ? null : analyseDay(day, startFrom);
    day.score = day.best ? day.best.score : null;
    const st = startAt === "now" ? (day.isToday ? nowH : null) : startAt;
    day.pick = st != null ? evalStart(day, st) : null;
    return day;
  });
  if (selected === 0 && days[0].over && startAt == null && !soft) selected = 1;
}

/* ---------- render ---------- */
const dayLabel = (d, long) => d.isToday ? "Today" : new Date(d.date + "T12:00").toLocaleDateString("en-GB", { weekday: long ? "long" : "short" });

function skyFor(d){
  const day = d.hours.filter(h => h.hour >= d.sunrise && h.hour < d.sunset);
  const p = Math.max(...day.map(h => h.p), 0), rad = day.reduce((a, h) => a + h.rad, 0) / Math.max(day.length, 1);
  return p >= 60 ? "rain" : rad > 180 ? "sun" : "cloud";
}

const fmtDur = h => { const m = Math.max(0, Math.round(h * 60)); if (m < 60) return m + "m"; const hh = Math.floor(m / 60), mm = m % 60; return hh + "h" + (mm ? " " + pad(mm) + "m" : ""); };
function rel(t, kind, d){
  if (!d.isToday || t == null) return "";
  const diff = t - nowH;
  if (kind === "out") return diff > 0.08 ? "in " + fmtDur(diff) : diff > -0.08 ? "now" : "out for " + fmtDur(-diff);
  return diff > 0.02 ? "in " + fmtDur(diff) : kind === "dry" ? "done" : "now";
}
const curOf = d => (startAt != null && d.pick) ? d.pick : d.best;

function syncControls(d, b){
  document.querySelectorAll("#segLoad button").forEach(x => x.setAttribute("aria-pressed", x.dataset.v === setup.load));
  document.querySelectorAll("#segHome button").forEach(x => x.setAttribute("aria-pressed", x.dataset.v === (setup.home !== false ? "home" : "out")));
  document.querySelectorAll("#segDryer button").forEach(x => x.setAttribute("aria-pressed", x.dataset.v === (setup.dryer ? "yes" : "no")));
  $("backRow").hidden = setup.home !== false; $("bkVal").textContent = fmtH(setup.back);
  const custom = startAt != null && d.pick;
  $("stBest").setAttribute("aria-pressed", !custom);
  $("stNow").setAttribute("aria-pressed", !!custom && startAt === "now");
  $("stNow").disabled = !d.isToday || d.over;
  $("stVal").textContent = b && !b.none ? fmtH(b.start) : "–";
}

function render(isSoft){
  const sf = !!isSoft;
  $("status").hidden = true; $("main").hidden = false;
  $("placeName").textContent = place.name;
  $("clock").textContent = pad(Math.floor(nowH) % 24) + ":" + pad(Math.floor((nowH % 1) * 60));
  const d = days[selected], b = curOf(d), best = d.best && !d.best.none ? d.best : null;
  document.body.dataset.sky = skyFor(d);
  try { document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.body).getPropertyValue("--g1").trim(); } catch {}
  $("eyebrow").textContent = d.isToday ? (d.sunset > nowH ? "Today · sunset in " + fmtDur(d.sunset - nowH) : "Today · after sunset") : dayLabel(d, true) + " · sunset " + fmtH(d.sunset);
  let rels = ["", "", ""];
  const set = (score, verdict, col, sum, o, dr, i) => {
    countTo($("score"), score); $("verdict").textContent = verdict; $("dot").style.background = col;
    $("summary").textContent = sum; $("tOut").textContent = o; $("tDry").textContent = dr; $("tIn").textContent = i;
  };
  if (!b) set("–", "Day's over", "var(--fg-3)", "Not much daylight left today. Check tomorrow in the day strip, or pick a time below.", "–", "–", "–");
  else if (b.none) set("0", "Keep it inside", "var(--bad)", "Rain is likely right through the daylight hours. No safe window. You can still pick a time below.", "–", "–", "–");
  else {
    const [, v, col] = tier(b.score);
    set(b.score, v, col, summaryText(d, b), fmtH(b.start), b.done ? fmtH(b.doneAt) : "Not fully", fmtH(b.bringIn));
    rels = [rel(b.start, "out", d), b.done ? rel(b.doneAt, "dry", d) : "", rel(b.bringIn, "in", d)];
  }
  $("rOut").textContent = rels[0]; $("rDry").textContent = rels[1]; $("rIn").textContent = rels[2];
  const cmp = $("compare"), showCmp = d.pick && best && startAt != null && Math.abs(best.start - d.pick.start) > 0.25 && best.score - d.pick.score >= 3;
  cmp.hidden = !showCmp; if (showCmp) cmp.textContent = "Best time is " + fmtH(best.start) + " (" + best.score + "/100). Switch to it";
  syncControls(d, b);

  if (!sf) scrubH = (b && !b.none) ? Math.min(Math.floor(b.start) + 1, 23) : (d.isToday ? Math.min(Math.floor(nowH), Math.floor(d.sunset)) : 12);
  drawChart(d); drawRead(d, true);
  drawFactors(d);
  drawDays();
  if (sf) return;
  if (firstRender){
    firstRender = false;
    [...document.querySelectorAll(".strip, .hero>*, #main>.wrap>*")].forEach((el, i) =>
      anim(el, [{ opacity: 0, transform: "translateY(14px)" }, { opacity: 1, transform: "none" }], { duration: 700, delay: 60 * i, easing: SPRING }));
  } else {
    ["tOut","tDry","tIn"].forEach((id, i) => anim($(id), [{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }], { duration: 450, delay: 40 * i, easing: SPRING }));
    anim($("dot"), [{ transform: "scale(0)" }, { transform: "scale(1.4)", offset: .6 }, { transform: "scale(1)" }], { duration: 500, easing: EASE });
  }
}
function softRender(){ soft = true; build(); render(true); soft = false; }

function summaryText(d, b){
  const dryer = setup.dryer, past = d.isToday && b.start < nowH - 0.1;
  if (b.start >= d.sunset - 0.25) return "That's after dark. Nothing dries overnight and the dew makes it wetter.";
  if (past){
    const r = evalStart(d, b.start, nowH), pct = Math.round(r.q * 100);
    return `Out since ${fmtH(b.start)}, about ${pct}% dry now. ` + (b.done ? `Should finish around ${fmtH(b.doneAt)}.` : b.interrupted ? `Rain from about ${fmtH(b.end)} will interrupt it.` : "It won't fully dry before it comes in.");
  }
  if (b.interrupted && b.end <= b.start + 0.01) return "It's wet or about to be at that time. Pick a later time, or switch to the best window.";
  const hrs = b.done ? (b.doneAt - b.start) : 0, hs = hrs < 1.25 ? "about an hour" : "about " + (Math.round(hrs * 2) / 2) + " hours";
  if (b.soaked) return "A shower lands before you're back. It'll get wet on the line, so leave it in today.";
  if (b.done && b.maxP < 25) return `Out at ${fmtH(b.start)} and it should be dry in ${hs}. Little chance of rain.`;
  if (b.done) return `Dry in ${hs}, but rain chance touches ${b.maxP}%. Keep half an eye on the sky.`;
  const finish = dryer ? "finish it in the dryer" : "finish it on an airer";
  if (b.interrupted) return `Rain from around ${fmtH(b.end)}. It'll be roughly ${Math.round(b.q * 100)}% dry by then, so ${finish}.`;
  return `Slow drying. Expect it roughly ${Math.round(b.q * 100)}% dry by the time it comes in, then ${finish}.`;
}

/* chart: smooth drying curve, rain bars, best window, scrub cursor */
let geo = null;
function drawChart(d){
  const h0 = Math.max(0, Math.floor(d.sunrise) - 1), h1 = Math.min(23, Math.ceil(d.sunset) + 1);
  const hrs = d.hours.filter(h => h.hour >= h0 && h.hour <= h1);
  const W = 400, H = 150, L = 14, R = 386, T = 14, B = 112;
  const x = hr => L + (hr - h0) / (h1 - h0) * (R - L);
  const y = v => B - v / 100 * (B - T);
  geo = { h0, h1, x, W, L, R };
  const pts = hrs.map(h => [x(h.hour), y(h.r.score)]);
  let path = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++){ const [px, py] = pts[i-1], [cx, cy] = pts[i], mx = (px + cx) / 2; path += ` C${mx},${py} ${mx},${cy} ${cx},${cy}`; }
  const area = path + ` L${pts[pts.length-1][0]},${B} L${pts[0][0]},${B} Z`;
  let s = `<defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>`;
  const c0 = curOf(d), b = c0 && !c0.none ? c0 : null;
  if (d.isToday && nowH > h0 && nowH < h1) s += `<rect x="${L}" y="${T-6}" width="${x(nowH)-L}" height="${B-T+6}" fill="#000" opacity=".1"/>`;
  if (b){ const e = b.done ? b.doneAt : b.end; const bx = x(b.start), bw2 = Math.max(x(e)-bx, 3); s += `<rect x="${bx}" y="${T-6}" width="${bw2}" height="${B-T+6}" rx="8" fill="#fff" opacity=".13"/><rect x="${bx+4}" y="${T-6}" width="${Math.max(bw2-8,2)}" height="3" rx="1.5" fill="var(--warm)"/>`; }
  [50].forEach(v => s += `<line x1="${L}" x2="${R}" y1="${y(v)}" y2="${y(v)}" stroke="#fff" stroke-opacity=".14" stroke-dasharray="2 4"/>`);
  s += `<path id="cArea" d="${area}" fill="url(#ga)"/><path id="cLine" d="${path}" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>`;
  // rain bars
  const bw = (R - L) / (h1 - h0) * 0.5;
  hrs.forEach(h => { if (h.p >= 15){ const hh = h.p / 100 * 22; s += `<rect class="rb" x="${x(h.hour)-bw/2}" y="${136-hh}" width="${bw}" height="${hh}" rx="1.5" fill="var(--rainc)" opacity="${h.r.wet ? .95 : .55}"/>`; } });
  for (let hr = h0; hr <= h1; hr += 3) s += `<text x="${x(hr)}" y="148" text-anchor="middle">${pad(hr)}</text>`;
  if (d.isToday && nowH > h0 && nowH < h1) s += `<line x1="${x(nowH)}" x2="${x(nowH)}" y1="${T-6}" y2="${B}" stroke="var(--warm)" stroke-width="1.5" stroke-dasharray="3 3"/><text x="${x(nowH)}" y="${T-9}" text-anchor="middle" style="fill:var(--warm)">now</text>`;
  s += `<g id="cursor"><line x1="0" x2="0" y1="${T-6}" y2="138" stroke="#fff" stroke-width="1.2"/><circle id="cd" cx="0" cy="0" r="5" fill="#fff" stroke="rgba(0,0,0,.2)"/></g>`;
  $("chart").innerHTML = s;
  const line = $("cLine"), len = line.getTotalLength ? line.getTotalLength() : 0;
  if (len && !reduce && !soft){
    line.style.strokeDasharray = len;
    anim(line, [{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 1100, easing: EASE });
    anim($("cArea"), [{ opacity: 0 }, { opacity: 1 }], { duration: 900, delay: 250, easing: "ease" });
    document.querySelectorAll("#chart .rb").forEach((r, i) => { r.style.transformBox = "fill-box"; r.style.transformOrigin = "bottom"; anim(r, [{ transform: "scaleY(0)" }, { transform: "scaleY(1)" }], { duration: 500, delay: 300 + i * 25, easing: SPRING }); });
  }
}

function drawRead(d, jump){
  const h = d.hours.find(r => r.hour === scrubH) || d.hours[12];
  const { x } = geo, B = 112, T = 14, y = v => B - v / 100 * (B - T);
  const cur = $("cursor"), cd = $("cd");
  if (jump){ cur.style.transition = cd.style.transition = "none"; }
  cur.style.transform = `translate(${x(h.hour)}px,0)`; cd.style.transform = `translate(0,${y(h.r.score)}px)`;
  if (jump){ cur.getBoundingClientRect(); cur.style.transition = cd.style.transition = ""; }
  const dark = h.hour < d.sunrise - 0.5 || h.hour >= d.sunset;
  $("rHour").firstChild.nodeValue = pad(h.hour) + ":00";
  $("rScore").textContent = dark ? "After dark" : "Drying " + h.r.score + "/100";
  $("rChips").innerHTML = [
    ["Rain", h.p + "%"], ["Temp", Math.round(h.t) + "°"], ["Wind", Math.round(h.wind) + " km/h"], ["Humidity", Math.round(h.rh) + "%"], ["Sun", Math.round(h.rad) + " W/m²"]
  ].map(([k, v]) => `<span class="chip"><em>${k}</em>${v}</span>`).join("");
  $("scrub").setAttribute("aria-valuenow", h.hour); $("scrub").setAttribute("aria-valuetext", pad(h.hour) + ":00, drying score " + h.r.score);
}

function scrubTo(clientX){
  const r = $("scrub").getBoundingClientRect(), { h0, h1, L, R, W } = geo;
  const px = (clientX - r.left) / r.width * W;
  const hr = Math.round(h0 + (px - L) / (R - L) * (h1 - h0));
  const nh = clamp(hr, h0, h1);
  if (nh !== scrubH){ scrubH = nh; drawRead(days[selected]); }
}
const sc = $("scrub");
sc.addEventListener("pointerdown", e => { sc.setPointerCapture(e.pointerId); scrubTo(e.clientX); });
sc.addEventListener("pointermove", e => { if (sc.hasPointerCapture(e.pointerId)) scrubTo(e.clientX); });
sc.addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  e.preventDefault(); scrubH = clamp(scrubH + (e.key === "ArrowRight" ? 1 : -1), geo.h0, geo.h1); drawRead(days[selected]);
});

function drawFactors(d){
  const c0 = curOf(d), b = c0 && !c0.none ? c0 : null;
  const win = b ? d.hours.filter(h => h.hour >= b.start && h.hour < Math.max(b.end, b.start + 1)) : d.hours.filter(h => h.hour >= d.sunrise && h.hour < d.sunset);
  const avg = k => win.reduce((a, h) => a + k(h), 0) / Math.max(win.length, 1);
  const max = k => Math.max(...win.map(k), 0);
  const maxP = max(h => h.p), rh = avg(h => h.rh), vpd = avg(h => h.r.vpd), wind = avg(h => h.wind), gust = max(h => h.gust);
  const rad = avg(h => h.rad), cloud = avg(h => h.cloud), t = avg(h => h.t);
  const duskRH = (d.hours.find(h => h.hour === Math.floor(d.sunset)) || {}).rh ?? rh;
  const left = d.sunset - (b ? b.start : d.sunrise);
  const rows = [
    ["Rain chance", maxP + "%", 1 - maxP / 100, maxP < 20 ? "Low risk of a soaking." : maxP < 50 ? "Showers possible. Stay close enough to grab it." : "Rain likely. This is what's holding the score back."],
    ["Air dryness", Math.round(rh) + "% · " + vpd.toFixed(2) + " kPa", clamp(vpd, 0, 1), vpd > 0.8 ? "Dry air pulls water out fast." : vpd > 0.4 ? "Moderate. It'll dry, just not quickly." : "Air is nearly saturated. Very slow evaporation."],
    ["Wind", Math.round(wind) + " km/h", gust > 60 ? 0.4 : clamp(wind / 20, 0, 1), gust > 60 ? `Gusts to ${Math.round(gust)} km/h. Extra pegs, or skip the sheets.` : wind > 12 ? "A proper breeze carrying moisture away." : wind > 5 ? "Light breeze. Helps a little." : "Still air. Moisture hangs around the fabric."],
    ["Sunshine", Math.round(rad) + " W/m²", clamp(rad / 450, 0, 1), rad > 300 ? "Strong sun warming the fabric." : rad > 120 ? `Some sun through ${Math.round(cloud)}% cloud.` : "Mostly grey. Little help from the sun."],
    ["Temperature", t.toFixed(0) + "°C", clamp((t - 3) / 17, 0, 1), t > 16 ? "Warm enough to speed things up." : t > 9 ? "Cool, so wind and dry air do the work." : "Cold. Expect slow going."],
    ["Daylight", Math.max(left, 0).toFixed(1) + " h", clamp(left / 9, 0, 1), `Sunrise ${fmtH(d.sunrise)}, sunset ${fmtH(d.sunset)}.`],
    ["Evening damp", Math.round(duskRH) + "% at dusk", clamp((95 - duskRH) / 30, 0, 1), duskRH > 88 ? "Dew sets in fast after sunset. In before dusk." : "Dusk stays fairly dry."]
  ];
  $("factors").innerHTML = rows.map(([n, v, s, note]) => `<div class="f"><span class="n">${n}</span><span class="v">${v}</span><div class="bar"><i style="width:${Math.round(clamp(s, .04, 1) * 100)}%"></i></div><span class="note">${note}</span></div>`).join("");
  const worst = rows.slice(0, 5).reduce((a, r) => r[2] < a[2] ? r : a);
  $("whyMeta").textContent = worst[2] < 0.45 ? worst[0] + " is the weak spot" : "";
}

function drawDays(){
  const colOf = d => d.score == null ? "var(--fg-3)" : tier(d.score)[2];
  $("strip").innerHTML = days.map((d, i) => `<button class="dp" type="button" role="tab" data-i="${i}" aria-selected="${i === selected}"><span>${dayLabel(d)}</span><b>${d.score ?? "–"}</b><i style="background:${colOf(d)}"></i></button>`).join("");
  const sel = $("strip").querySelector('[aria-selected="true"]');
  if (sel && !soft) sel.scrollIntoView({ inline: "center", block: "nearest", behavior: reduce ? "auto" : "smooth" });
  $("days").innerHTML = days.map((d, i) => {
    const s = d.score, col = colOf(d);
    return `<button class="dayrow" type="button" data-i="${i}" aria-current="${i === selected}"><span class="dn">${dayLabel(d)}</span><span class="ds">${s ?? "–"}</span><span class="dbar"><i style="width:${s ?? 0}%;background:${col}"></i></span><span class="dv">${s == null ? "Over" : tier(s)[1]}</span></button>`;
  }).join("");
  const bestI = days.reduce((a, d, i) => (d.score ?? -1) > (days[a].score ?? -1) ? i : a, 0);
  $("weekMeta").textContent = "Best: " + dayLabel(days[bestI]);
}
$("strip").addEventListener("click", e => { const b = e.target.closest(".dp"); if (b) switchDay(+b.dataset.i); });
function switchDay(i){
  if (i === selected) return;
  const dir = i > selected ? 1 : -1, main = $("main");
  window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
  const out = anim(main, [{ opacity: 1, transform: "none" }, { opacity: 0, transform: `translateX(${-dir * 24}px)` }], { duration: 180, easing: "ease-in" });
  const go = () => { selected = i; render(); out && out.cancel(); anim(main, [{ opacity: 0, transform: `translateX(${dir * 24}px)` }, { opacity: 1, transform: "none" }], { duration: 520, easing: SPRING }); };
  out ? out.finished.then(go) : go();
}
$("days").addEventListener("click", e => { const b = e.target.closest(".dayrow"); if (!b) return; switchDay(+b.dataset.i); });

/* smooth disclosure panels */
document.querySelectorAll("details").forEach(det => {
  const sum = det.querySelector("summary");
  sum.addEventListener("click", e => {
    e.preventDefault();
    if (det._a){ det._a.cancel(); det._a = null; }
    const start = det.offsetHeight;
    if (!det.open){
      det.open = true; det.classList.add("is-open");
      const end = det.offsetHeight;
      det._a = anim(det, [{ height: start + "px" }, { height: end + "px" }], { duration: 520, easing: SPRING, fill: "none" });
      const kids = det.querySelectorAll(".f, .dayrow");
      kids.forEach((k, i) => anim(k, [{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }], { duration: 450, delay: 60 + i * 40, easing: SPRING }));
      det.querySelectorAll(".bar i, .dbar i").forEach((b, i) => { b.style.transformOrigin = "left"; anim(b, [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: 700, delay: 120 + i * 40, easing: SPRING }); });
    } else {
      det.classList.remove("is-open");
      const end = sum.offsetHeight + 2;
      det._a = anim(det, [{ height: start + "px" }, { height: end + "px" }], { duration: 320, easing: "cubic-bezier(.4,0,.2,1)", fill: "none" });
      if (det._a) det._a.onfinish = () => { det.open = false; det._a = null; }; else det.open = false;
    }
  });
});

/* ---------- controls ---------- */
const persist = () => store.set("pon.setup", setup);
const seg = (id, fn) => $(id).addEventListener("click", e => { const b = e.target.closest("button"); if (b){ fn(b.dataset.v); persist(); softRender(); } });
seg("segLoad", v => setup.load = v);
seg("segHome", v => setup.home = v === "home");
seg("segDryer", v => setup.dryer = v === "yes");
const stepBack = dir => { setup.back = clamp(Math.round(((setup.back ?? 17) + dir * 0.5) * 2) / 2, 9, 22); persist(); softRender(); };
$("bkMinus").addEventListener("click", () => stepBack(-1)); $("bkPlus").addEventListener("click", () => stepBack(1));
$("stBest").addEventListener("click", () => { startAt = null; softRender(); });
$("stNow").addEventListener("click", () => { startAt = "now"; softRender(); });
function stepStart(dir){
  const d = days[selected], b = curOf(d);
  const base = startAt === "now" ? nowH : (startAt ?? (b && !b.none ? b.start : (d.isToday ? nowH : 9)));
  startAt = clamp(Math.round((base + dir * 0.5) * 2) / 2, 0, 23.5); softRender();
}
$("stMinus").addEventListener("click", () => stepStart(-1)); $("stPlus").addEventListener("click", () => stepStart(1));
$("setHere").addEventListener("click", () => { startAt = scrubH; softRender(); window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }); });
$("compare").addEventListener("click", () => { startAt = null; softRender(); });

/* ---------- settings sheet ---------- */
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let geoRes = [], st_t;
function renderRes(){
  $("res").innerHTML = `<button class="opt" type="button" data-geo="1"><b>Use my location</b><span>Ask the browser where you are</span></button><button class="opt" type="button" data-cur="1" aria-pressed="true"><b>${esc(place.name)}</b><span>Current</span></button>`;
}
function openSetup(){
  $("search").value = ""; renderRes(); syncControls(days[selected] || { isToday: false, over: true }, null);
  $("sheet").hidden = false; $("sheet").classList.remove("closing");
  anim($("sheet"), [{ opacity: 0 }, { opacity: 1 }], { duration: 300, easing: "ease", fill: "none" });
  anim(document.querySelector(".card"), [{ transform: "translateY(60px) scale(.98)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 600, easing: SPRING, fill: "none" });
}
function closeSetup(){
  if ($("sheet").hidden) return;
  const a = anim(document.querySelector(".card"), [{ transform: "none", opacity: 1 }, { transform: "translateY(40px) scale(.98)", opacity: 0 }], { duration: 260, easing: "ease-in" });
  $("sheet").classList.add("closing");
  const done = () => { $("sheet").hidden = true; $("sheet").classList.remove("closing"); a && a.cancel(); };
  a ? a.finished.then(done) : done();
}
function pickPlace(p){ place = p; store.set("pon.place", place); selected = 0; closeSetup(); data = null; fetchForecast(false); }
$("search").addEventListener("input", e => {
  clearTimeout(st_t); const q = e.target.value.trim(); if (q.length < 2){ renderRes(); return; }
  st_t = setTimeout(async () => {
    try {
      const j = await (await fetch("https://geocoding-api.open-meteo.com/v1/search?count=5&language=en&name=" + encodeURIComponent(q))).json();
      geoRes = j.results || [];
      $("res").innerHTML = geoRes.length ? geoRes.map((p, i) => `<button class="opt" type="button" data-r="${i}"><b>${esc(p.name)}</b><span>${esc([p.admin1, p.country].filter(Boolean).join(", "))}</span></button>`).join("") : `<p class="qs">No matches. Try a nearby town.</p>`;
      [...$("res").children].forEach((c, i) => anim(c, [{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }], { duration: 380, delay: i * 35, easing: SPRING }));
    } catch { $("res").innerHTML = `<p class="qs">Search isn't reachable right now.</p>`; }
  }, 280);
});
$("res").addEventListener("click", e => {
  const b = e.target.closest(".opt"); if (!b) return;
  if (b.dataset.r != null){ const p = geoRes[+b.dataset.r]; pickPlace({ name: p.name, lat: p.latitude, lon: p.longitude }); }
  else if (b.dataset.cur) closeSetup();
  else if (b.dataset.geo){
    if (!navigator.geolocation){ b.querySelector("span").textContent = "Not available here. Search instead."; return; }
    b.querySelector("span").textContent = "Locating…";
    navigator.geolocation.getCurrentPosition(
      p => pickPlace({ name: "Your location", lat: +p.coords.latitude.toFixed(3), lon: +p.coords.longitude.toFixed(3) }),
      () => { b.querySelector("span").textContent = "Location blocked. Search instead."; },
      { timeout: 10000, maximumAge: 600000 });
  }
});
$("setupBtn").addEventListener("click", openSetup);
$("placeBtn").addEventListener("click", openSetup);
$("done").addEventListener("click", closeSetup);
$("sheet").addEventListener("click", e => { if (e.target === $("sheet")) closeSetup(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSetup(); });
$("refreshBtn").addEventListener("click", () => { lastTry = Date.now(); fetchForecast(true); });

/* ---------- live time ---------- */
let lastTry = Date.now(), lastMin = -1;
function tick(){
  if (!data) return;
  const n = liveNow(), t = Date.now();
  if (n >= 24){ if (t - lastTry > 30e3){ lastTry = t; fetchForecast(true); } return; }
  $("clock").textContent = pad(Math.floor(n)) + ":" + pad(Math.floor((n % 1) * 60));
  const m = Math.floor(n * 60);
  if (m !== lastMin){ lastMin = m; if (!$("main").hidden && $("sheet").hidden) softRender(); }
  if (t - lastTry > (stale ? 60e3 : 15 * 60e3)){ lastTry = t; fetchForecast(true); }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden){ if (Date.now() - fetchedAt > 5 * 60e3){ lastTry = Date.now(); fetchForecast(true); } else tick(); } });
addEventListener("online", () => { lastTry = Date.now(); fetchForecast(true); });

/* swipe between days */
let tx = 0, ty = 0;
$("main").addEventListener("touchstart", e => { const t = e.touches[0]; tx = t.clientX; ty = t.clientY; }, { passive: true });
$("main").addEventListener("touchend", e => {
  if (e.target.closest(".scrub, .strip, .stepper")) return;
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 45){ const i = selected + (dx < 0 ? 1 : -1); if (i >= 0 && i < days.length) switchDay(i); }
}, { passive: true });
document.addEventListener("click", e => { if (e.target.closest("button") && navigator.vibrate) try { navigator.vibrate(6); } catch {} });

/* ---------- installable app bits ---------- */
function makeIcon(sz){
  const c = document.createElement("canvas"); c.width = c.height = sz; const g = c.getContext("2d");
  const gr = g.createLinearGradient(0, 0, 0, sz); gr.addColorStop(0, "#2c6fb8"); gr.addColorStop(1, "#9cc3e6");
  g.fillStyle = gr; g.fillRect(0, 0, sz, sz);
  g.fillStyle = "rgba(255,255,255,.96)"; g.beginPath(); g.arc(sz * .5, sz * .4, sz * .17, 0, 7); g.fill();
  g.strokeStyle = "#fff"; g.lineWidth = sz * .025; g.lineCap = "round";
  g.beginPath(); g.moveTo(sz * .14, sz * .7); g.quadraticCurveTo(sz * .5, sz * .82, sz * .86, sz * .7); g.stroke();
  g.fillStyle = "rgba(255,255,255,.9)"; [[.34, .75], [.5, .78], [.66, .75]].forEach(([x, y]) => g.fillRect(sz * x - sz * .035, sz * y, sz * .07, sz * .1));
  return c.toDataURL("image/png");
}
try {
  const l = document.createElement("link"); l.rel = "apple-touch-icon"; l.href = makeIcon(180); document.head.appendChild(l);
  const m = document.createElement("link"); m.rel = "manifest";
  m.href = "data:application/manifest+json;base64," + btoa(JSON.stringify({ name: "Peg or Not", short_name: "Peg or Not", display: "standalone", start_url: location.href.split("#")[0], background_color: "#2c6fb8", theme_color: "#2c6fb8", icons: [{ src: makeIcon(512), sizes: "512x512", type: "image/png", purpose: "any maskable" }] }));
  document.head.appendChild(m);
} catch {}

/* ---------- boot ---------- */
fetchForecast(false);
setInterval(tick, 10000);
})();
</script>
</body>
</html>
